services:
  - type: web
    name: codesentinel
    runtime: node
    # 512 MB. Starter (2 GB) is optional if scans grow.
    plan: free
    buildCommand: NODE_OPTIONS="--max-old-space-size=460" NEXT_TELEMETRY_DISABLED=1 NPM_CONFIG_PRODUCTION=false npm ci && NODE_OPTIONS="--max-old-space-size=460" NEXT_TELEMETRY_DISABLED=1 npm run build
    startCommand: sh scripts/render-start.sh
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: --max-old-space-size=384
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DB_POOL_MAX
        value: "2"
      - key: APP_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: codesentinel-db
          property: connectionString
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_APP_ID
        sync: false
      - key: GITHUB_APP_PRIVATE_KEY
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false

databases:
  - name: codesentinel-db
    plan: free
    postgresMajorVersion: "16"
